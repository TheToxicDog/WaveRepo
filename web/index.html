<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaveGrab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%231ed760'/><path d='M5 13c1.5 0 1.5-4 3-4s1.5 7 3 7 1.5-10 3-10 1.5 7 3 7 1.5-3 2-3' stroke='%2304130a' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-theme="midnight">
  <canvas id="fx"></canvas>

  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 13c1.5 0 1.5-4 3-4s1.5 7 3 7 1.5-10 3-10 1.5 7 3 7 1.5-3 3-3 1.5 2 3 2" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></div>
        <span>WaveGrab</span>
      </div>
      <nav class="nav" id="nav-main"></nav>
      <div class="nav-section"><span>Your Library</span><button id="new-playlist" title="New playlist"></button></div>
      <nav class="nav" id="nav-lib"></nav>
      <div class="playlists" id="playlists"></div>
      <div class="side-foot">
        <nav class="nav"><a href="#/settings" data-route="settings" id="nav-settings"></a></nav>
        <div id="drives"></div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button class="round-btn" id="back" title="Back"></button>
        <button class="round-btn" id="fwd" title="Forward"></button>
        <label class="searchbox" id="topsearch">
          <span id="search-ic"></span>
          <input id="q" placeholder="Search songs, artists, lyrics…" autocomplete="off" spellcheck="false">
        </label>
        <div class="top-status" id="top-status"></div>
      </header>
      <div id="view"></div>
    </main>

    <aside id="panel">
      <div class="panel-tabs" id="panel-tabs"></div>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <footer id="player">
      <div class="p-now" id="p-now"></div>
      <div class="p-center">
        <div class="p-ctrls" id="p-ctrls"></div>
        <div class="p-seek">
          <span id="p-cur">0:00</span>
          <div class="slider" id="p-seek"><i></i><b></b></div>
          <span id="p-dur">0:00</span>
        </div>
      </div>
      <div class="p-right" id="p-right"></div>
    </footer>
  </div>

  <div id="nowplaying"></div>
  <div id="toast"></div>
  <div id="ctxmenu"></div>
  <div id="modal"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
